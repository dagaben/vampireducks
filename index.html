<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Vampire Ducks</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>

    <!-- HUD -->
    <div id="hud">
      <div id="lives">❤️ 5</div>
      <div id="garlic-count">🧄 0</div>
      <div id="score">Score: 0</div>
      <div id="time-of-day">☀️ Day</div>
    </div>

    <!-- Mobile controls -->
    <div id="mobile-controls">
      <div id="joystick-zone"></div>
      <div id="jump-button">JUMP</div>
    </div>

    <!-- Start / Game Over screens -->
    <div id="start-screen" class="overlay">
      <h1>Vampire Ducks</h1>
      <p>Collect garlic. Petrify the rubber vampire ducks.<br>Survive as long as you can!</p>
      <button id="start-button">Play</button>
      <p class="controls-hint">Desktop: Arrow keys + J to jump<br>Mobile: Joystick + tap Jump</p>
    </div>

    <div id="game-over-screen" class="overlay hidden">
      <h1>Game Over</h1>
      <p id="final-score">Score: 0</p>
      <button id="restart-button">Play Again</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
