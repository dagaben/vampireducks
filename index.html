<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Vampire Ducks</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>

    <!-- HUD -->
    <div id="hud">
      <div id="lives">❤️ 5</div>
      <div id="garlic-count">🧄 0</div>
      <div id="score">Score: 0</div>
      <div id="time-of-day">☀️ Day (safe)</div>
      <button id="pause-button" type="button" title="Pause (P)">⏸</button>
    </div>

    <!-- Mobile controls -->
    <div id="mobile-controls">
      <div id="joystick-zone"></div>
      <div id="jump-button">JUMP</div>
    </div>

    <!-- Start screen -->
    <div id="start-screen" class="overlay">
      <img
        id="title-banner"
        src="./title-banner.svg"
        alt="Vampire Ducks — Collect garlic by day. Fight off rubber duck vampires at night"
        width="900"
        height="420"
      />
      <button id="start-button">PLAY</button>
      <div id="home-leaderboard" class="leaderboard">
        <h2>🏆 TOP 10</h2>
        <ol id="home-scores"></ol>
      </div>
      <p class="controls-hint">Desktop: Arrow keys + J to jump · P to pause<br>Mobile: Joystick + Jump</p>
    </div>

    <div id="pause-screen" class="overlay hidden">
      <h1>Paused</h1>
      <p>Take a breath. Garlic is waiting.</p>
      <button id="resume-button">Resume</button>
    </div>

    <!-- Game Over + name entry + leaderboard -->
    <div id="game-over-screen" class="overlay hidden">
      <h1>Game Over</h1>
      <p id="final-score">Score: 0</p>

      <div id="name-entry" class="hidden">
        <p class="name-prompt">NEW HIGH SCORE! Enter your initials</p>
        <div class="initials-row">
          <input id="initial-0" class="initial-input" type="text" maxlength="1" value="A" />
          <input id="initial-1" class="initial-input" type="text" maxlength="1" value="A" />
          <input id="initial-2" class="initial-input" type="text" maxlength="1" value="A" />
        </div>
        <button id="submit-name-button">SAVE</button>
      </div>

      <div id="go-leaderboard" class="leaderboard hidden">
        <h2>🏆 TOP 10</h2>
        <ol id="go-scores"></ol>
      </div>

      <button id="restart-button">Play Again</button>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
